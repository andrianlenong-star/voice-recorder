<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#e11d48" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer rounded background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#cubeGradient)" filter="url(#glow)" />
  
  <!-- Subtle inner border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Cube ACR iconic 'C' -->
  <text x="180" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="240" font-weight="900" fill="#ffffff" letter-spacing="-6">C</text>

  <!-- Soundwave pulse bars inside the C opening -->
  <rect x="290" y="210" width="16" height="90" rx="8" fill="#ffffff" fill-opacity="0.95" />
  <rect x="320" y="175" width="16" height="160" rx="8" fill="#ffffff" />
  <rect x="350" y="225" width="16" height="60" rx="8" fill="#ffffff" fill-opacity="0.9" />

  <!-- Live recording green dot -->
  <circle cx="395" cy="115" r="28" fill="#10b981" stroke="#020617" stroke-width="8" />
</svg>
